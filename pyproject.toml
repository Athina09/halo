[project]
name = "halo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "httpx", "uvicorn", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["halo", "evals", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
